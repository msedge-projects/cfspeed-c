name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install curl || true

      # MSYS2 gives the Windows build the same gcc as the other two targets,
      # and pacman supplies curl, so the port does not need a second toolchain.
      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: make CC=clang

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          make
          strip cfspeed.exe || true

      # The pure modules - stats, chart, fmt, actions - carry no libcurl
      # dependency, so the suite builds and runs without a network.
      - name: Unit tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make test

      - name: Unit tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          make test

      # History persistence and view rendering. Neither links libcurl, so they
      # build and run without a network.
      - name: History and view tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          make test-history
          make test-views

      - name: History and view tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          make test-history
          make test-views

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cfspeed-${{ matrix.os }}
          path: cfspeed*
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # Behavioural gate.
      #
      # Every step above proves the code compiles. Not one of them proves the
      # thing measures anything, and both of this project's worst regressions
      # compiled cleanly and shipped behind a green build:
      #
      #   - Windows libcurl is GnuTLS-backed, GnuTLS reads trust anchors from a
      #     file, and Windows keeps its trust store in a registry database that
      #     only schannel can read. Every request died with
      #     CURLE_PEER_FAILED_VERIFICATION (curl error 60) and cfspeed reported
      #     nothing at all.
      #   - speed.cloudflare.com/meta began answering {}, so colo, client IP and
      #     location all came back blank while the build stayed green.
      #
      # scripts/smoke.sh closes that gap: it runs the binary built above,
      # parses stdout with a real JSON parser (python3/python - never a grep),
      # and fails unless the document parses, download.avg > 0,
      # download.bytes > 0, and meta.colo is a non-empty string. A binary that
      # runs, exits 0 and reports zeros must NOT pass.
      #
      # Deliberately no continue-on-error anywhere on this path: a run that
      # measured nothing has to fail the job, not annotate it.
      #
      # These steps sit after the upload so a smoke run cannot perturb what the
      # artifact contains.
      #
      # KNOWN FLAKINESS, stated rather than papered over: Cloudflare rate-limits
      # repeated speed tests from one address, and cfspeed detects that case and
      # exits non-zero with "The test transferred no data - Cloudflare refused
      # every request". A runner that trips it goes red here. That is the gate
      # working, not the gate misfiring - a throttled run really did measure
      # nothing - so there is deliberately no retry and no softening. Fresh
      # runners get fresh addresses and this has not reproduced otherwise; if it
      # starts reproducing, the fix belongs in how often we test, not in the
      # assertions.

      # No platform needs a CA bundle now. The POSIX build uses libcurl, whose
      # default finds /etc/ssl/certs/ca-certificates.crt unaided on both runners;
      # the Windows build uses WinHTTP, which reads the Windows trust store
      # directly. Neither ships a certificate file.
      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        # A full run is ~30-40s. This is headroom for a cold runner and a slow
        # network, and it is still finite, so a wedged run fails instead of
        # hanging the job until the 6h ceiling.
        timeout-minutes: 5
        run: bash scripts/smoke.sh ./cfspeed

      - name: Smoke test (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 5
        run: bash scripts/smoke.sh ./cfspeed

      # Windows is the leg that silently shipped the curl-60 bug twice: a build
      # that could not verify a single certificate still went green, because the
      # gate only ever compiled it. This one runs it, which is why a missing CA
      # store is caught here rather than by a user. WinHTTP removed the cause,
      # but the gate is what keeps it from coming back.
      #
      # Honest caveat: this may well be belt-and-braces on the runner itself.
      # MSYS2 ships /mingw64/etc/ssl/certs/ca-bundle.crt, and GnuTLS falls back
      # to it, so a runner with the toolchain installed can verify TLS without
      # the bundle. It is fetched anyway because the regression this gate exists
      # for happens on machines that do NOT have an MSYS2 tree, and exercising
      # the same trust path the release ships is the point.
      #
      # No DLL staging is needed: /mingw64/bin is already on PATH inside this
      # shell, so libcurl and its transitive GnuTLS/nettle chain resolve.
      #
      # On the JSON parser: this leg must not depend on `python3`, which
      # windows-latest does not put on PATH. smoke.sh resolves an interpreter
      # itself - python3, then python, then pwsh/powershell ConvertFrom-Json -
      # and actually executes the candidate before trusting it, so the Microsoft
      # Store execution alias (which prints "Python was not found" and exits
      # non-zero) cannot be mistaken for a working interpreter. All three are
      # real parsers. If none is found the script fails loudly rather than
      # passing vacuously.
      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        timeout-minutes: 5
        run: |
          export PATH="/mingw64/bin:$PATH"
          # No CA fetch: WinHTTP uses the Windows trust store.
          bash scripts/smoke.sh ./cfspeed.exe