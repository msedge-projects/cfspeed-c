name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-aarch64
          - os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            make

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make && strip cfspeed || true

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: make CC=clang && strip cfspeed || true

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          make
          strip cfspeed.exe || true
          test -f cfspeed.exe

      # Windows libcurl is GnuTLS-backed, and GnuTLS reads its trust list from
      # a file. Windows keeps its trust store in a registry database only
      # schannel can use, so without this file every request fails certificate
      # verification and the app measures nothing at all.
      - name: Fetch CA bundle
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: bash scripts/fetch-ca.sh cfspeed-ca.pem

      # ldd reports only DIRECT imports, so one pass collects libcurl and
      # nothing beneath it. The tree has to be walked to a fixed point or the
      # shipped package dies on the user's machine with a missing DLL.
      - name: Collect Windows runtime dependencies
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          mkdir -p stage
          cp cfspeed.exe stage/

          # A space-separated string, not an array: it survives the MSYS2
          # wrapper intact. The loop body reads from a FILE, never a pipe -
          # `ldd | while read` runs in a subshell where every update to the
          # queue and the seen-set is discarded on exit, so the walk silently
          # collects exactly one level and stops.
          queue="cfspeed.exe"
          seen=" "
          while [ -n "$queue" ]; do
            cur="${queue%% *}"
            if [ "$cur" = "$queue" ]; then queue=""; else queue="${queue#* }"; fi
            ldd "$cur" > ldd.out 2>/dev/null || true
            while IFS= read -r line; do
              case "$line" in
                *"=> "*)
                  # Take the path, not the name: the name appears on both sides
                  # of "=>" and grep -o returns the leftmost match.
                  dep="${line##*=> }"
                  case "$dep" in
                    /c/Windows/*|'') continue ;;
                  esac
                  [ -f "$dep" ] || continue
                  d="$(basename "$dep")"
                  case "$seen" in *" $d "*) continue ;; esac
                  seen="$seen$d "
                  cp -f "$dep" stage/ 2>/dev/null || true
                  queue="$queue $dep"
                  ;;
              esac
            done < ldd.out
          done

          if [ ! -f cfspeed-ca.pem ]; then
            echo "::error::CA bundle was not fetched; the binary cannot verify TLS without it"
            exit 1
          fi
          cp cfspeed-ca.pem stage/

          # Fail loudly here rather than shipping a package that cannot start.
          n=$(ls stage/*.dll 2>/dev/null | wc -l)
          echo "collected $n runtime DLLs:"
          ls stage
          if [ ! -f stage/libcurl-4.dll ]; then
            echo "::error::libcurl-4.dll missing from the package"
            exit 1
          fi
          if [ "$n" -lt 10 ]; then
            echo "::error::only $n DLLs collected; the dependency walk is probably shallow again"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp stage/* dist/
            (cd dist && zip -q cfspeed-${{ matrix.asset }}.zip *)
            test -f dist/cfspeed-${{ matrix.asset }}.zip
          else
            cp cfspeed dist/cfspeed-${{ matrix.asset }}
            tar -czf dist/cfspeed-${{ matrix.asset }}.tar.gz -C dist cfspeed-${{ matrix.asset }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # One publisher, not one per matrix leg: parallel jobs racing to create the
  # same release is how you get half-published releases.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      # Computed once, here, over every asset. Writing checksums.txt in each
      # matrix leg produced three files with the same name that then collided
      # at upload time.
      - name: Checksum every asset
        run: |
          set -euo pipefail
          cd staged
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$GITHUB_WORKSPACE/checksums.txt"
          cat "$GITHUB_WORKSPACE/checksums.txt"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksums.txt
            staged/**/*.zip
            staged/**/*.tar.gz
          generate_release_notes: true