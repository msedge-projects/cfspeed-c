name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-aarch64
          - os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make && strip cfspeed || true

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: make CC=clang && strip cfspeed || true

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          make
          strip cfspeed.exe || true
          test -f cfspeed.exe

      # No CA fetch and no DLL collection: the Windows build is WinHTTP, which
      # ships with Windows and reads the Windows trust store. The package is
      # the executable and nothing else.

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item cfspeed.exe dist/
          Compress-Archive -Path dist/cfspeed.exe -DestinationPath dist/cfspeed-${{ matrix.asset }}.zip
          if (-not (Test-Path dist/cfspeed-${{ matrix.asset }}.zip)) {
            Write-Error 'zip was not created'
            exit 1
          }
          # One file, no more. A dependency reappearing here means the WinHTTP
          # switch regressed and the package would install 14 MB again.
          $n = (Get-ChildItem dist/cfspeed.exe).Length
          Write-Host ("packaged a single {0:N0} byte executable" -f $n)

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp cfspeed dist/cfspeed-${{ matrix.asset }}
          tar -czf dist/cfspeed-${{ matrix.asset }}.tar.gz -C dist cfspeed-${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # One publisher, not one per matrix leg: parallel jobs racing to create the
  # same release is how you get half-published releases.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      # Computed once, here, over every asset. Writing checksums.txt in each
      # matrix leg produced three files of the same name that collided at upload.
      - name: Checksum every asset
        run: |
          set -euo pipefail
          cd staged
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$GITHUB_WORKSPACE/checksums.txt"
          cat "$GITHUB_WORKSPACE/checksums.txt"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksums.txt
            staged/**/*.zip
            staged/**/*.tar.gz
          generate_release_notes: true