name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-aarch64
          - os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            make

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make && strip cfspeed || true

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: make CC=clang && strip cfspeed || true

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          make
          strip cfspeed.exe || true
          test -f cfspeed.exe

      # Windows libcurl is GnuTLS-backed, and GnuTLS reads its trust list from
      # a file. Windows keeps its trust store in a registry database that only
      # schannel can read, so without this file every request fails certificate
      # verification and the app measures nothing at all.
      - name: Fetch CA bundle
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: bash scripts/fetch-ca.sh cfspeed-ca.pem

      - name: Collect Windows runtime dependencies
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          mkdir -p stage
          cp cfspeed.exe stage/

          # ldd reports only DIRECT imports, so one pass finds libcurl and
          # nothing beneath it. The tree must be walked to a fixed point.
          #
          # Each round rescans everything collected so far and copies what it
          # finds, so no state is carried between rounds. An earlier version used
          # `ldd | while read` and queued its finds in a shell variable: that loop
          # body runs in a subshell, every update died with it, and the walk
          # silently collected exactly one level. A bounded number of independent
          # rounds cannot fail that way.
          for round in 1 2 3 4 5 6; do
            : > found.txt
            for f in stage/*.dll stage/*.exe; do
              [ -f "$f" ] || continue
              # Only /mingw64 paths are shipped. Anything under /c/Windows is a
              # system DLL that is already on the user's machine.
              ldd "$f" 2>/dev/null \
                | sed -n 's|.*=> */mingw64/\([^ ]*\.dll\).*|\1|p' \
                | sed 's|^|/mingw64/|' >> found.txt
            done
            [ -s found.txt ] || break
            while read -r dep; do
              cp -f "/mingw64/$dep" stage/ 2>/dev/null || true
            done < found.txt
          done

          if [ ! -f cfspeed-ca.pem ]; then
            echo "::error::CA bundle was not fetched; the binary cannot verify TLS without it"
            exit 1
          fi
          cp cfspeed-ca.pem stage/

          # Fail loudly here rather than shipping a package that cannot start.
          n=$(ls stage/*.dll 2>/dev/null | wc -l)
          echo "collected $n runtime DLLs:"
          ls stage
          if [ ! -f stage/libcurl-4.dll ]; then
            echo "::error::libcurl-4.dll missing from the package"
            exit 1
          fi
          if [ "$n" -lt 10 ]; then
            echo "::error::only $n DLLs collected; the dependency walk is probably shallow again"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp stage/* dist/
            (cd dist && zip -q cfspeed-${{ matrix.asset }}.zip *)
            test -f dist/cfspeed-${{ matrix.asset }}.zip
          else
            cp cfspeed dist/cfspeed-${{ matrix.asset }}
            tar -czf dist/cfspeed-${{ matrix.asset }}.tar.gz -C dist cfspeed-${{ matrix.asset }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # One publisher, not one per matrix leg: parallel jobs racing to create the
  # same release is how you get half-published releases.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      # Computed once, here, over every asset. Writing checksums.txt in each
      # matrix leg produced three files of the same name that collided at upload.
      - name: Checksum every asset
        run: |
          set -euo pipefail
          cd staged
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$GITHUB_WORKSPACE/checksums.txt"
          cat "$GITHUB_WORKSPACE/checksums.txt"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksums.txt
            staged/**/*.zip
            staged/**/*.tar.gz
          generate_release_notes: true