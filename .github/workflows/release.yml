name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-aarch64
          - os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            make

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make && strip cfspeed || true

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: make CC=clang && strip cfspeed || true

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          make
          strip cfspeed.exe || true
          test -f cfspeed.exe

      # Windows libcurl is GnuTLS-backed, and GnuTLS reads its trust list from
      # a file. Windows keeps its trust store in a registry database that only
      # schannel can read, so without this file every request fails certificate
      # verification and the app measures nothing at all.
      - name: Fetch CA bundle
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: bash scripts/fetch-ca.sh cfspeed-ca.pem

      - name: Collect Windows runtime dependencies
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          # The walk lives in a script, not inline here: it is the one piece of
          # this workflow with real logic in it, and inline YAML through the
          # MSYS2 wrapper failed in ways that were painful to diagnose. A
          # versioned script can be run and tested on its own.
          bash scripts/collect-dlls.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp stage/* dist/
            (cd dist && zip -q cfspeed-${{ matrix.asset }}.zip *)
            test -f dist/cfspeed-${{ matrix.asset }}.zip
          else
            cp cfspeed dist/cfspeed-${{ matrix.asset }}
            tar -czf dist/cfspeed-${{ matrix.asset }}.tar.gz -C dist cfspeed-${{ matrix.asset }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # One publisher, not one per matrix leg: parallel jobs racing to create the
  # same release is how you get half-published releases.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      # Computed once, here, over every asset. Writing checksums.txt in each
      # matrix leg produced three files of the same name that collided at upload.
      - name: Checksum every asset
        run: |
          set -euo pipefail
          cd staged
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$GITHUB_WORKSPACE/checksums.txt"
          cat "$GITHUB_WORKSPACE/checksums.txt"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksums.txt
            staged/**/*.zip
            staged/**/*.tar.gz
          generate_release_notes: true